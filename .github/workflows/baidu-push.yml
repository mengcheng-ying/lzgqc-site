name: 百度链接自动推送

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  baidu-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史，供脚本用 git diff 检测本次变更的文件
          fetch-depth: 0

      - name: 推送链接到百度
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: node .github/scripts/baidu-push.js
